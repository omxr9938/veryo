<title>Veryo – Ernährungstagebuch</title>
<style>
:root{--bg:#0b0f14;--card:#141a22;--card2:#1b232d;--line:#243040;--tx:#eef3f8;--mut:#8a98a8;--acc:#2ee59d;--acc2:#16b97b;--prot:#5aa9ff;--carb:#ffb84d;--fat:#ff6b81;--warn:#ffb84d;--bad:#ff6b81;--good:#2ee59d;--r:20px}

html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{padding-bottom:calc(92px + env(safe-area-inset-bottom))}

h1{font-size:26px;margin:6px 0 14px;letter-spacing:-.5px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin:22px 4px 8px;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px}.sp{flex:1}.mut{color:var(--mut)}.sm{font-size:13px}.b{font-weight:600}
button{font:inherit;color:inherit;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:10px 14px;cursor:pointer}
button.pri{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#04210f;border:0;font-weight:700}
button.ghost{background:none;border:0;color:var(--acc);padding:6px 8px}
button.danger{color:var(--bad)}
input,select,textarea{font:inherit;color:var(--tx);background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
label{display:block;font-size:12px;color:var(--mut);margin:12px 2px 5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

.dnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.dnav b{font-size:17px}.dnav button{width:40px;height:40px;padding:0;border-radius:50%;font-size:18px}

.ring{position:relative;width:132px;height:132px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .c b{font-size:28px;letter-spacing:-1px}.ring .c span{font-size:12px;color:var(--mut)}
.stats{flex:1;display:grid;gap:10px}.stats div{display:flex;justify-content:space-between;font-size:14px}
.stats b{font-size:16px}
.mac{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
.mac .t{font-size:12px;color:var(--mut);display:flex;justify-content:space-between;margin-bottom:6px}
.bar{height:7px;background:var(--card2);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;border-radius:9px;transition:width .4s}
.mac .v{font-size:13px;margin-top:5px}

.meal .head{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.meal .head .ic{font-size:22px}.meal .head b{font-size:16px}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.item .n{flex:1;min-width:0}.item .n div:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.add{width:34px;height:34px;border-radius:50%;padding:0;background:var(--acc);color:#04210f;border:0;font-size:22px;line-height:1;font-weight:700}
.empty{color:var(--mut);font-size:14px;padding:6px 0 2px}

.nut{margin:12px 0}.nut .t{display:flex;justify-content:space-between;font-size:14px;margin-bottom:5px}
/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line)}
.tabs .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 70px 1fr 1fr;align-items:center}
.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mut);padding:6px 0}
.tabs button span{font-size:22px;filter:grayscale(1);opacity:.7}
.tabs button.on{color:var(--acc)}.tabs button.on span{filter:none;opacity:1}
.tabs .fab{width:58px;height:58px;border-radius:50%;margin:-26px auto 0;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#04210f;font-size:32px;font-weight:700;padding:0;box-shadow:0 8px 24px rgba(46,229,157,.35);display:block;line-height:1}

#sheet.open{display:block}
#sheet .p{position:absolute;left:0;right:0;bottom:0;top:36px;max-width:520px;margin:0 auto;background:var(--bg);border-radius:26px 26px 0 0;border:1px solid var(--line);overflow-y:auto;padding:14px 16px calc(24px + env(safe-area-inset-bottom));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border-radius:14px;padding:4px;margin:8px 0 14px;border:1px solid var(--line)}
.seg button{border:0;background:none;border-radius:11px;padding:9px 4px;font-size:14px;color:var(--mut)}
.seg button.on{background:var(--card2);color:var(--tx);font-weight:600}
.res{display:flex;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.res .n{flex:1;min-width:0}.res .n div:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
video{width:100%;border-radius:18px;background:#000;aspect-ratio:4/3;object-fit:cover}
.scanbox{position:relative}.scanbox:after{content:"";position:absolute;left:12%;right:12%;top:50%;height:2px;background:var(--acc);box-shadow:0 0 14px var(--acc);animation:sc 2s infinite}
@keyframes sc{0%,100%{top:28%}50%{top:72%}}
.chip{display:inline-block;background:var(--card2);border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:13px;margin:0 6px 6px 0;cursor:pointer}
.chip.on{background:var(--acc);color:#04210f;border-color:var(--acc);font-weight:600}
/* coach */
.ins{display:flex;gap:12px;align-items:flex-start}
.ins .e{font-size:24px;line-height:1.1}.ins b{display:block;margin-bottom:2px}.ins p{margin:0;color:var(--mut);font-size:14px}
.ins.warn{border-left:4px solid var(--warn)}.ins.bad{border-left:4px solid var(--bad)}.ins.good{border-left:4px solid var(--good)}.ins.info{border-left:4px solid var(--prot)}
.ai{white-space:pre-wrap;font-size:15px}.ai b{color:var(--acc)}
.bub{padding:10px 14px;border-radius:16px;margin:8px 0;max-width:92%;font-size:15px;white-space:pre-wrap}
.bub.u{background:var(--acc);color:#04210f;margin-left:auto;border-bottom-right-radius:4px}
.bub.a{background:var(--card2);border-bottom-left-radius:4px}
#toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:14px;z-index:99;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90%;text-align:center}
#toast.on{opacity:1}
.spin{display:inline-block;width:18px;height:18px;border:3px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:r .8s linear infinite;vertical-align:middle}
@keyframes r{to{transform:rotate(360deg)}}
.water{display:flex;align-items:center;gap:12px}.water .gl{display:flex;gap:4px;flex:1;flex-wrap:wrap}.water .gl i{width:18px;height:26px;border-radius:4px 4px 8px 8px;border:2px solid var(--prot);opacity:.35}.water .gl i.f{background:var(--prot);opacity:1}
a[data-a]{cursor:pointer}
details summary{cursor:pointer;color:var(--acc);font-size:14px;margin-top:12px}
</style>
</head>

const FOODS=DB_RAW.map((r,i)=>({id:'l'+i,name:r[0],n:Object.fromEntries(KEYS.map((k,j)=>[k,r[j+1]]))}));
const MICRO=[
 {k:'vA',n:'Vitamin A',u:'µg',r:1000,rf:800,s:'Karotten, Spinat, Süßkartoffeln, Eier'},

if(!S.users){const old=Object.assign({},S.profile||{});S.apiKey=S.apiKey||old.apiKey||'';S.model=old.model||S.model;delete old.apiKey;delete old.model;

/* ============ Berechnungen ============ */
function plan(p=U().profile){
  const bmr=10*p.w+6.25*p.h-5*p.age+(p.sex==='m'?5:-161);
  const tdee=bmr*p.act,floor=p.sex==='m'?1500:1200,rate=+p.pace||.5;
  const hm=p.h/100,bmi=p.w/(hm*hm),wLo=18.5*hm*hm,wHi=24.9*hm*hm;
  let adj=0,capped=false,floored=false;
  if(p.goal==='lose'){adj=-rate*7700/7;const cap=tdee*.25;if(-adj>cap){adj=-cap;capped=true}}
  if(p.goal==='gain'){adj=Math.min(Math.min(rate,.5)*7700/7,tdee*.15)}
  let auto=Math.round((tdee+adj)/10)*10;
  if(p.goal==='lose'&&auto<floor){auto=floor;floored=true}
  const custom=+p.kcal>0,kcal=custom?+p.kcal:auto;
  const weekly=(tdee-kcal)*7/7700; // kg/Woche, + = Abnahme
  const tw=+p.tw||0;
  let weeks=null;
  if(tw&&((p.w>tw&&weekly>.02)||(p.w<tw&&weekly<-.02)))weeks=Math.ceil(Math.abs(p.w-tw)/Math.abs(weekly));
  return {bmr,tdee,floor,bmi,wLo,wHi,adj,capped,floored,auto,kcal,custom,belowFloor:custom&&kcal<floor&&p.goal==='lose',weekly,weeks,tw};
}
function goals(){
  const p=U().profile,P=plan(p),kcal=P.kcal,d=p.diet||'bal';
  const ref=Math.min(p.w,24.9*(p.h/100)**2);
  const gkg={bal:p.goal==='lose'?1.6:1.4,prot:p.goal==='lose'?2:1.8,low:1.6}[d];
  const prot=Math.round(ref*gkg),fat=Math.round(kcal*({bal:.3,prot:.3,low:.45}[d])/9);
  const carb=Math.max(0,Math.round((kcal-prot*4-fat*9)/4));
  const water=Math.min(3500,Math.max(1500,Math.round(p.w*35/250)*250));
  return {kcal,prot,fat,carb,auto:P.auto,water,fiber:Math.round(Math.max(25,kcal/1000*14)),sugar:50,salt:6,sat:Math.round(kcal*.1/9)};
}
function logWeight(w){

}
function weightInsight(){
  const ws=(U().weights||[]).filter(x=>Date.now()-new Date(x.d+'T12:00')<=28*864e5);
  if(ws.length<2)return null;
  const a=ws[0],b=ws[ws.length-1],span=(new Date(b.d)-new Date(a.d))/864e5;
  if(span<7)return null;
  const rate=(b.w-a.w)/span*7,p=U().profile;
  if(p.goal==='lose'){
    if(-rate>b.w*.01)return {t:'warn',e:'⚖️',h:`Gewicht sinkt schnell (${r1(-rate)} kg/Woche)`,p:'Mehr als ca. 1 % des Körpergewichts pro Woche ist oft zu viel – das kostet Muskeln. Iss etwas mehr und achte auf Eiweiß.'};
    if(span>=14&&rate>-.1)return {t:'info',e:'⚖️',h:'Gewicht stagniert',p:'Das ist normal (Wasser, Zyklus). Bleib dran, miss immer morgens nüchtern und beurteile den Trend über 2–3 Wochen.'};
    return {t:'good',e:'⚖️',h:`Gewichtstrend: ${r1(rate)} kg/Woche`,p:'Genau im gesunden Bereich – weiter so.'};
  }
  if(p.goal==='hold'&&Math.abs(rate)>.5)return {t:'info',e:'⚖️',h:`Gewicht ändert sich (${r1(rate)} kg/Woche)`,p:'Dein Ziel ist das Gewicht zu halten – passe ggf. dein Kalorienziel an.'};
  return null;
}
function extraInsights(){
  const P=plan(),G=goals(),out=[],w=weightInsight();

  if(P.belowFloor)out.push({t:'bad',e:'🛑',h:'Eigenes Ziel sehr niedrig',p:`Dein Ziel liegt unter ${P.floor} kcal. Ohne ärztliche Begleitung wird das nicht empfohlen (Mangelerscheinungen, Jojo-Effekt).`});
  if(w)out.push(w);

}

function analyze(){
  const G=goals(),T=totals(date),d=day(),out=[],H=new Date().getHours();
  const today=date===dstr(new Date());
  if(!d.items.length)return[{t:'info',e:'📝',h:'Noch keine Einträge',p:'Trag deine Mahlzeiten ein – dann bekommst du hier persönliche Hinweise.'},...extraInsights()];
  const kp=T.kcal/G.kcal;
  if(kp>1.1)out.push({t:'bad',e:'🔥',h:`Kalorienziel überschritten (+${r0(T.kcal-G.kcal)} kcal)`,p:'Wähle für den Rest des Tages leichte Optionen: Gemüse, Salat, Skyr. Ein Ausreißer ist unproblematisch – entscheidend ist der Wochenschnitt.'});
  else if(kp>=.9)out.push({t:'good',e:'🎯',h:'Kalorienziel fast erreicht',p:`Noch ${r0(G.kcal-T.kcal)} kcal frei. Gut dosiert!`});
  else if(!today||H>=19)out.push({t:'warn',e:'⚠️',h:`Nur ${r0(kp*100)}% deines Kalorienziels`,p:'Dauerhaft zu wenig essen bremst Stoffwechsel und Nährstoffversorgung. Iss ausreichend, auch beim Abnehmen.'});
  else out.push({t:'info',e:'⏳',h:`Noch ${r0(G.kcal-T.kcal)} kcal übrig`,p:'Verteile sie auf die nächsten Mahlzeiten – mit Eiweiß und Gemüse als Basis.'});
  const pp=T.p/G.prot;
  if(pp<.7&&(kp>.5||!today))out.push({t:'warn',e:'💪',h:`Eiweiß niedrig (${r0(T.p)}/${G.prot} g)`,p:'Gut für Sättigung und Muskeln: Skyr, Magerquark, Eier, Hähnchen, Linsen, Tofu.'});
  else if(pp>=.95)out.push({t:'good',e:'💪',h:'Eiweißziel erreicht',p:'Super für Sättigung und Muskelerhalt.'});
  if(T.fiber<G.fiber*.6&&kp>.5)out.push({t:'warn',e:'🌾',h:`Ballaststoffe niedrig (${r0(T.fiber)}/${G.fiber} g)`,p:'Mehr Vollkorn, Haferflocken, Hülsenfrüchte, Gemüse und Beeren. Dazu genug trinken.'});
  if(T.sugar>G.sugar)out.push({t:'bad',e:'🍬',h:`Viel Zucker (${r0(T.sugar)} g)`,p:'Die WHO empfiehlt weniger als ca. 50 g freien Zucker pro Tag. Süße Getränke zuerst reduzieren.'});
  if(T.salt>G.salt)out.push({t:'bad',e:'🧂',h:`Viel Salz (${r1(T.salt)} g)`,p:'Mehr als 6 g/Tag können den Blutdruck erhöhen. Fertigprodukte, Wurst und Käse sparsam wählen.'});
  if(T.sat>G.sat)out.push({t:'warn',e:'🧈',h:`Viele gesättigte Fette (${r0(T.sat)} g)`,p:'Tausche teils gegen Olivenöl, Nüsse, Avocado oder Fisch.'});
  if(d.water<1500&&(!today||H>=14))out.push({t:'info',e:'💧',h:'Zu wenig getrunken',p:`Bisher ${(d.water/1000).toFixed(2)} l. Ziel: etwa 2–2,5 l Wasser oder ungesüßter Tee.`});
  // Mikronährstoffe
  if(kp>.6||!today){
    const real=MICRO.filter(m=>T[m.k]/m.r<.4).sort((a,b)=>T[a.k]/a.r-T[b.k]/b.r).slice(0,4);
    real.forEach(m=>out.push({t:'warn',e:'🥕',h:`${m.n}: ${r0(T[m.k]/m.r*100)}% des Tagesbedarfs`,p:`Quellen: ${m.s}.`}));
    if(!real.length)out.push({t:'good',e:'🌈',h:'Vitamine & Mineralstoffe gut abgedeckt',p:'Alle Werte über 40% des Tagesbedarfs – weiter so mit der Vielfalt.'});

  if(p.goal==='lose'&&P.bmi<18.5)n.push(['bad','Dein BMI liegt im Untergewicht. Abnehmen wird hier nicht empfohlen.']);
  else if(p.goal==='lose'&&P.bmi<20)n.push(['warn','Dein BMI ist schon niedrig. Abnehmen nur nach Rücksprache mit einer Ärztin / einem Arzt.']);
  if(P.tw&&P.tw<P.wLo)n.push(['warn',`Dein Zielgewicht liegt unter dem gesunden Bereich (${r1(P.wLo)}–${r1(P.wHi)} kg).`]);
  if(P.capped&&!P.floored)n.push(['info','Das gewünschte Tempo wurde begrenzt: Das Defizit beträgt höchstens 25 % deines Bedarfs – schonend für Muskeln und Stoffwechsel.']);

let scan={stream:null,iv:null,reader:null,done:false};
async function startScan(){
  const video=$('#cam'),msg=$('#scanmsg');scan.done=false;
  if(!navigator.mediaDevices?.getUserMedia){msg.textContent='Kamera nicht verfügbar (HTTPS nötig). Tippe den Code unten ein.';return}
  try{
    if('BarcodeDetector' in window){
      const det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e']});
      scan.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}});
      video.srcObject=scan.stream;await video.play();msg.textContent='Halte den Barcode ins Bild …';
      scan.iv=setInterval(async()=>{try{const r=await det.detect(video);if(r[0])onCode(r[0].rawValue)}catch(e){}},350);
    }else{
      await loadZX();msg.textContent='Halte den Barcode ins Bild …';
      scan.reader=new ZXing.BrowserMultiFormatReader();
      scan.reader.decodeFromVideoDevice(undefined,video,(res)=>{if(res)onCode(res.getText())}).catch(e=>{msg.textContent='Kamera-Zugriff verweigert. Tippe den Code unten ein.'});
    }
  }catch(e){msg.textContent='Kamera-Zugriff nicht möglich. Tippe den Code unten ein.'}
}
function loadZX(){return window.ZXing?Promise.resolve():new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js';s.onload=ok;s.onerror=no;document.head.appendChild(s)})}
function stopScan(){clearInterval(scan.iv);scan.iv=null;scan.stream?.getTracks().forEach(t=>t.stop());scan.stream=null;try{scan.reader?.reset()}catch(e){}scan.reader=null}
async function onCode(code){
  if(scan.done)return;scan.done=true;stopScan();if(navigator.vibrate)navigator.vibrate(60);
  const msg=$('#scanmsg');if(msg)msg.innerHTML='<span class="spin"></span> Suche '+esc(code)+' …';
  try{
    const r=await fetch(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json?fields=code,product_name,product_name_de,brands,serving_quantity,nutriments`);
    const j=await r.json();
    if(j.status===1&&j.product){const f=fromOFF(j.product);f.barcode=code;return openPortion(f,A.meal)}

  <div class="card" style="margin-top:16px" id="pv"></div>
  <button class="pri" style="width:100%;padding:14px;font-size:17px" data-a="commit">${edit?'Speichern':'Zum Tagebuch hinzufügen'}</button>`);
  $('#pg').addEventListener('input',e=>{P.g=parseFloat(e.target.value)||0;pv()});pv();
}
function pv(){
  const n=P.food.n,m=P.g/100,box=$('#pv');if(!box)return;
  box.innerHTML=`<div class="row"><div><div style="font-size:30px;font-weight:700;letter-spacing:-1px">${r0(n.kcal*m)}<span class="mut sm"> kcal</span></div></div><span class="sp"></span>
  <div class="sm" style="text-align:right"><span style="color:var(--carb)">KH ${r1(n.c*m)} g</span> · <span style="color:var(--prot)">E ${r1(n.p*m)} g</span> · <span style="color:var(--fat)">F ${r1(n.f*m)} g</span></div></div>
  <div class="sm mut" style="margin-top:8px">Zucker ${r1(n.sugar*m)} g · Ballaststoffe ${r1(n.fiber*m)} g · Salz ${r1(n.salt*m)} g</div>
  <div class="sm mut" style="margin-top:4px">${MICRO.filter(x=>n[x.k]>0).slice(0,6).map(x=>`${x.n} ${r1(n[x.k]*m)} ${x.u}`).join(' · ')||'Keine Vitaminangaben'}</div>`;
}
function commit(){
  if(!(P.g>0))return toast('Bitte Menge eingeben');
  if(P.edit){const it=day().items.find(i=>i.id===P.edit.id);it.g=P.g;it.meal=P.meal;save();return closeSheet()}
  day().items.push({id:uid(),meal:P.meal,name:P.food.name+(P.food.brand?` (${P.food.brand})`:''),g:P.g,n:P.food.n,ts:Date.now()});
  S.recent=[P.food.id,...S.recent.filter(x=>x!==P.food.id)].slice(0,20);
  (S.recentObj=S.recentObj||{})[P.food.id]=P.food;
  Object.keys(S.recentObj).forEach(k=>{if(!S.recent.includes(k))delete S.recentObj[k]});
  save();toast('Hinzugefügt ✓');A.q='';A.online=[];A.tab='search';drawAdd();
}

/* ============ Events ============ */
const H={
  tab:v=>{tab=v;render();scrollTo(0,0)},
  antab:v=>{anTab=v;render()},
  user:v=>{S.cur=v;save();render()},
  adduser:()=>{const n=(prompt('Name der Person:')||'').trim();if(!n)return;const id='u'+uid();S.users[id]={name:n,profile:newProfile(),days:{},weights:[]};S.cur=id;save();tab='me';chat=[];render();scrollTo(0,0)},
  deluser:()=>{if(Object.keys(S.users).length>1&&confirm('„'+U().name+'“ und alle Einträge löschen?')){delete S.users[S.cur];S.cur=Object.keys(S.users)[0];save();render()}},
  copy:v=>{const prev=U().days[dstr(new Date(new Date(date+'T12:00').getTime()-864e5))];if(!prev)return;const d=day();prev.items.filter(i=>i.meal===v).forEach(i=>d.items.push({...i,id:uid(),ts:Date.now()}));save();toast('Kopiert ✓');render()},
  wadd:()=>{const w=parseFloat(($('#wi').value||'').replace(',','.'));if(!(w>20&&w<400))return toast('Bitte gültiges Gewicht eingeben');logWeight(w);save();toast('Gewicht gespeichert ✓');render()},
  wdel:v=>{U().weights=(U().weights||[]).filter(x=>x.d!==v);const ws=U().weights;if(ws.length)U().profile.w=ws[ws.length-1].w;save();render()},
  day:v=>{date=dstr(new Date(new Date(date+'T12:00').getTime()+v*864e5));render()},
  add:v=>openAdd(v),close:()=>closeSheet(),
  atab:v=>{A.tab=v;drawAdd()},ameal:v=>{A.meal=v;drawAdd()},
  pick:v=>{const f=window._res[v];if(f)openPortion(f,A.meal)},
  online:()=>searchOnline(),ean:()=>{const c=$('#ean').value.trim();if(c){scan.done=false;onCode(c)}},
  saveown:()=>saveOwn(),back:()=>drawAdd(),
  setg:v=>{P.g=+v;$('#pg').value=v;pv()},pmeal:v=>{P.meal=v;const g=$('#pg').value;openPortion(P.food,v,P.edit);$('#pg').value=g;P.g=+g||0;pv()},
  commit:()=>commit(),
  edit:v=>{const it=day().items.find(i=>i.id===v);if(it)openPortion({id:'e'+v,name:it.name,n:it.n},it.meal,it)},
  del:()=>{const d=day();d.items=d.items.filter(i=>i.id!==P.edit.id);save();closeSheet()},
  water:v=>{const d=day();d.water=Math.max(0,d.water+(+v));save();render()},
  ai:v=>{if(!aiBusy)callAI(AIQ[v][0],AIQ[v][1])},
  ask:()=>{const q=$('#q').value.trim();if(q&&!aiBusy)callAI(q)},
  export:()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({...S,apiKey:''})],{type:'application/json'}));a.download='veryo-backup-'+dstr(new Date())+'.json';a.click()},
  import:()=>{const i=document.createElement('input');i.type='file';i.accept='application/json';i.onchange=async()=>{try{const k=S.apiKey,n=JSON.parse(await i.files[0].text());n.apiKey=n.apiKey||k;localStorage.setItem(LS,JSON.stringify(n));location.reload()}catch(e){toast('Ungültige Datei')}};i.click()},
  reset:()=>{if(confirm('Wirklich alle Daten löschen?')){localStorage.removeItem(LS);location.reload()}}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||el.disabled)return;H[el.dataset.a]?.(el.dataset.v)});
document.addEventListener('change',e=>{
  const f=e.target.dataset.f;if(!f)return;const v=e.target.value;
  if(f==='apiKey'||f==='model'){S[f]=v.trim();save();render();return}
  if(f==='name'){U().name=v.trim()||'Person';save();render();return}
  const p=U().profile;
  p[f]=['sex','goal','diet'].includes(f)?v:(parseFloat(String(v).replace(',','.'))||0);
  if(f==='w'&&p.w>0)logWeight(p.w);
  if(f==='goal'&&v==='hold')p.tw=0;
  p.set=true;save();render();
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'){if(e.target.id==='q')H.ask();if(e.target.id==='ean')H.ean();if(e.target.id==='wi')H.wadd()}});

/* App-Icon für den Home-Bildschirm */
try{const c=document.createElement('canvas');c.width=c.height=180;const x=c.getContext('2d');const g=x.createLinearGradient(0,0,180,180);g.addColorStop(0,'#2ee59d');g.addColorStop(1,'#0e8f5d');x.fillStyle=g;x.fillRect(0,0,180,180);x.fillStyle='#04210f';x.font='bold 110px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText('V',90,98);const l=document.createElement('link');l.rel='apple-touch-icon';l.href=c.toDataURL();document.head.appendChild(l)}catch(e){}
render();
</script>
</body>
</html>
